name: Build libretro core (Android)

# Mirrors the android-arm64-v8a / android-x86_64 jobs in .gitlab-ci.yml, which
# have nowhere to run yet - there is no cemu project on git.libretro.com. The
# cmake invocation is kept identical to libretro's android-cmake template so
# that whatever works here works there too.

on:
  push:
    branches:
      - libretro
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  VCPKG_ROOT: "${{github.workspace}}/dependencies/vcpkg"

jobs:
  build-android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-22.04
    # Same reason the GitLab jobs are allow_failure: this target has never been
    # built, the whole vcpkg set has to come up for a cross triplet first.
    continue-on-error: true
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: arm64-android
          - abi: x86_64
            triplet: x64-android

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "Install host dependencies"
        run: |
          sudo apt update -qq
          sudo apt install -y --no-install-recommends \
            nasm autoconf automake libtool pkg-config python3 ninja-build

      - name: "Bootstrap vcpkg"
        run: bash ./dependencies/vcpkg/bootstrap-vcpkg.sh

      - name: "Configure"
        run: |
          # API level 24, as in the GitLab job: the template's default of 16 is
          # useless for C++20. CMAKE_TOOLCHAIN_FILE is the NDK's - the top-level
          # CMakeLists turns it into a vcpkg chainload toolchain.
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_BLUEZ=OFF \
            -DENABLE_FERAL_GAMEMODE=OFF \
            -DENABLE_WAYLAND=OFF \
            -DENABLE_DISCORD_RPC=OFF \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_STL=c++_static \
            -DANDROID_ABI=${{ matrix.abi }} \
            . -Bbuild/android-${{ matrix.abi }}

      - name: "Build"
        run: cmake --build build/android-${{ matrix.abi }} --target cemu_libretro --config Release -- -j $(nproc)

      - name: "Prepare artifact"
        run: mv bin/cemu_libretro.so cemu_libretro_android.so

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: cemu_libretro-android-${{ matrix.abi }}
          path: ./cemu_libretro_android.so
